    L.roundRect(ctx, x, y, w, h, r);
    ctx.fillStyle = o.fill || C.card; ctx.fill();
    ctx.lineWidth = 1.25; ctx.strokeStyle = o.border || C.cardBorder; ctx.stroke();
    // accent rail grows from the left
    ctx.fillStyle = L.rgba(accent, 0.95);
    ctx.fillRect(x + r, y, Math.max(0, (w - 2 * r) * clamp(p * 1.4 - 0.15) * (o.rail === undefined ? 0.22 : o.rail)), 2);
    ctx.restore();
    if (p < 1) scanBar(ctx, x, y, w, h, Math.min(0.999, 0.5 + k * 0.5), accent);
    if (p >= 0.6) LAYOUT.panels.push({ ...screenBox(ctx, x, y, w, h), fill: o.fill || C.card });
  };

  /* ------------------------------------------------------------------ camera */
  /** Global camera: within an act the zoom is continuous and pushes ×1.04 across every section
   *  (1.00 → 1.04 → 1.0816 ...). It re-enters at 1.00 on each act boundary (match-cut on the TL). */
  L.cam = (t, focus) => {
    let act = L.ACTS.find((a) => t >= a.t0 && t < a.t1) || L.ACTS[L.ACTS.length - 1];
    const secs = L.SECTIONS.filter((s) => s[0] >= act.t0 && s[1] <= act.t1);
    let k = 0;
    for (let i = 0; i < secs.length; i++) {
      const [s0, s1] = secs[i];
      if (t >= s1) k += 1; else if (t >= s0) k += (t - s0) / (s1 - s0);
    }
    const z = Math.pow(1.04, k);
    const fx = focus ? focus[0] : W / 2, fy = focus ? focus[1] : H / 2;
    const dx = 2.5 * Math.sin((TAU * t) / 8), dy = 1.6 * Math.sin((TAU * t) / 11 + 1);
    const e = fx - fx * z + dx, f = fy - fy * z + dy;
    return {
      z, fx, fy, dx, dy, e, f,
      apply(ctx) { ctx.transform(z, 0, 0, z, e, f); },
      toScreen(x, y) { return [x * z + e, y * z + f]; },
      toWorld(x, y) { return [(x - e) / z, (y - f) / z]; },
    };
  };

  /* ------------------------------------------------------------------ the through-line (TL) */
  /* The "Radar Phase Wave". Every form is a closed loop of N points parameterised by u ∈ [0,1):
   * u = 0 is the leftmost point, u ∈ [0,.5] runs over the top to the rightmost point, u ∈ [.5,1) returns along the bottom.
   * Open forms (pulse) run out and back along the same curve, so morphing pulse → loop "opens" the wave into a ring. */
  const N = 192;
  const FORMS = ['pulse', 'pixel', 'node', 'fringe', 'contour', 'ring'];
  function formPoint(form, u, s, out) {
    const ph = s.phase || 0;
    switch (form) {
      case 'pulse': {
        const q = u < 0.5 ? u * 2 : 2 - u * 2; // 0..1..0
        const env = Math.pow(Math.sin(Math.PI * q), 1.15);
        out[0] = -1 + 2 * q;
        out[1] = -(s.amp === undefined ? 1 : s.amp) * 0.34 * env * Math.sin(TAU * (s.cycles || 3.5) * q - ph);
        return;
      }
      case 'pixel': { // square, half side 0.62, perimeter param from left-mid, over the top
        const a = 0.62, per = u * 8; // 8 half-edges
        const seq = [[-a, 0], [-a, -a], [0, -a], [a, -a], [a, 0], [a, a], [0, a], [-a, a], [-a, 0]];
        const i = Math.min(7, Math.floor(per)), k = per - i;
        out[0] = lerp(seq[i][0], seq[i + 1][0], k); out[1] = lerp(seq[i][1], seq[i + 1][1], k);
        return;
      }
      case 'node': { const th = Math.PI + TAU * u; out[0] = 0.4 * Math.cos(th); out[1] = 0.4 * Math.sin(th); return; }
      case 'fringe': {
        const th = Math.PI + TAU * u;
        const r = 1 + 0.022 * (s.amp === undefined ? 1 : s.amp) * Math.sin(9 * th - ph * 2);
        out[0] = r * Math.cos(th); out[1] = r * Math.sin(th); return;
      }
      case 'contour': {
        const th = Math.PI + TAU * u, sd = s.seed || 7;
        let r = 1;
        for (let k = 2; k <= 5; k++) r += (0.05 + 0.06 * L.hash1(k, sd)) * Math.sin(k * th + TAU * L.hash1(k + 9, sd) + 0.15 * ph);
        out[0] = r * Math.cos(th) * 1.08; out[1] = r * Math.sin(th) * 0.9; return;
      }
      case 'ring': {
        const th = Math.PI + TAU * u;
        out[0] = Math.cos(th); out[1] = (s.aspect === undefined ? 0.34 : s.aspect) * Math.sin(th); return;
      }
      default: out[0] = 0; out[1] = 0;
    }
  }
  const CYAN = hex(C.cyan), CRIMSON = hex(C.crimson);
  function formColor(form, u, s) {
    if (s.tint && form !== 'fringe') return hex(s.tint);
    if (form === 'fringe') return L.fringeRGB(TAU * u + (s.phase || 0));
    if (form === 'contour') return CRIMSON;
    return CYAN;
  }
  const _pt = [0, 0], _pt2 = [0, 0];
  L.TL = {
    N, FORMS,
    /** Normalise a TL state. */
    state(s) {
      return Object.assign({ x: W / 2, y: H / 2, size: 100, rot: 0, form: 'pulse', to: null, k: 0, phase: 0, amp: 1, energy: 0.5, alpha: 1, lw: 1 }, s);
    },
    /** Points (screen space) + colours for a state. */
    points(st) {
      const s = this.state(st);
      const P = new Float32Array(N * 2), Cc = new Float32Array(N * 3);
      const k = s.to ? clamp(s.k) : 0;
      const cr = Math.cos(s.rot), sr = Math.sin(s.rot);
      for (let i = 0; i < N; i++) {
        const u = i / N;
        formPoint(s.form, u, s, _pt);
        let x = _pt[0], y = _pt[1];
        let col = formColor(s.form, u, s);
        if (s.to && k > 0) {
          formPoint(s.to, u, s, _pt2);
          x = lerp(x, _pt2[0], k); y = lerp(y, _pt2[1], k);
          const c2 = formColor(s.to, u, s);
          col = [lerp(col[0], c2[0], k), lerp(col[1], c2[1], k), lerp(col[2], c2[2], k)];
        }
        x *= s.size; y *= s.size;
        P[i * 2] = s.x + x * cr - y * sr; P[i * 2 + 1] = s.y + x * sr + y * cr;
        Cc[i * 3] = col[0]; Cc[i * 3 + 1] = col[1]; Cc[i * 3 + 2] = col[2];
      }
      return { P, C: Cc, s };
    },
    /** Weight of a form in a (possibly morphing) state. */
    weight(s, form) { if (!s.to) return s.form === form ? 1 : 0; const k = clamp(s.k); return (s.form === form ? 1 - k : 0) + (s.to === form ? k : 0); },
    /** Draw in SCREEN space (resets the transform). */
    draw(ctx, st) {
      const { P, C: Cc, s } = this.points(st);
      if (s.alpha <= 0) return;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = clamp(s.alpha);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      const sc = clamp(s.size / 110, 0.55, 1.35) * s.lw;
      const e = clamp(s.energy, 0, 1.5);
      const layers = [[15 * sc, 0.07 + 0.06 * e, 'lighter'], [6.5 * sc, 0.16 + 0.12 * e, 'lighter'], [2.6 * sc, 1, 'source-over']];
      const CH = 48, per = N / CH;
      for (const [lw, a, op] of layers) {
        ctx.globalCompositeOperation = op; ctx.lineWidth = lw;
        ctx.lineCap = op === 'lighter' ? 'butt' : 'round'; // butt caps: additive chunks must not overlap (no beading)
        for (let c = 0; c < CH; c++) {
          const i0 = Math.floor(c * per), i1 = Math.floor((c + 1) * per);
          const im = Math.min(N - 1, (i0 + i1) >> 1);
          ctx.strokeStyle = `rgba(${Cc[im * 3] | 0},${Cc[im * 3 + 1] | 0},${Cc[im * 3 + 2] | 0},${a})`;
          ctx.beginPath(); ctx.moveTo(P[i0 * 2], P[i0 * 2 + 1]);
          for (let i = i0 + 1; i <= i1; i++) { const j = i % N; ctx.lineTo(P[j * 2], P[j * 2 + 1]); }
          ctx.stroke();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
      // form-specific accents, weighted by morph
      const wPix = this.weight(s, 'pixel'), wNode = this.weight(s, 'node'), wRing = this.weight(s, 'ring'), wFr = this.weight(s, 'fringe');
      const base = s.tint ? hex(s.tint) : CYAN;
      if (wPix > 0.01) { // complex phasor inside the SLC pixel
        const r = s.size * 0.5, a = (s.phase || 0) * 0.5 - 0.6;
        ctx.globalAlpha = clamp(s.alpha) * wPix;
        ctx.strokeStyle = C.gold; ctx.fillStyle = C.gold; ctx.lineWidth = 2.2 * sc;
        const ex = s.x + Math.cos(a) * r * 0.82, ey = s.y + Math.sin(a) * r * 0.82;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.beginPath(); ctx.arc(ex, ey, 3.5 * sc, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(s.x, s.y, 2.5 * sc, 0, TAU); ctx.fill();
      }
      if (wNode > 0.01) {
        ctx.globalAlpha = clamp(s.alpha) * wNode;
        ctx.fillStyle = L.css(base, 1);
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size * 0.16, 0, TAU); ctx.fill();
        const ring = ((s.phase || 0) / TAU) % 1;
        ctx.strokeStyle = L.css(base, 0.5 * (1 - ring)); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size * (0.45 + 0.5 * ring), 0, TAU); ctx.stroke();
      }
      if (wRing > 0.01) {
        ctx.globalAlpha = clamp(s.alpha) * wRing;
        ctx.fillStyle = L.css(base, 1);
        const th = (s.phase || 0) * 0.5;
        const ax = Math.cos(th) * s.size, ay = (s.aspect === undefined ? 0.34 : s.aspect) * Math.sin(th) * s.size;
        ctx.beginPath(); ctx.arc(s.x + ax * Math.cos(s.rot) - ay * Math.sin(s.rot), s.y + ax * Math.sin(s.rot) + ay * Math.cos(s.rot), 5 * sc, 0, TAU); ctx.fill();
      }
      if (wFr > 0.01) {
        ctx.globalAlpha = clamp(s.alpha) * wFr * 0.5;
        ctx.lineWidth = 1;
        for (let k = 1; k <= 2; k++) {
          ctx.strokeStyle = L.css(L.fringeRGB((s.phase || 0) + k * 2), 0.6);
          ctx.beginPath(); ctx.arc(s.x, s.y, s.size * (1 - 0.22 * k), 0, TAU); ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
      L.glow(ctx, s.x, s.y, s.size * (0.9 + 0.5 * e), this.dominant(s) === 'contour' ? C.crimson : C.cyan, 0.25 * e * clamp(s.alpha)); // still in screen space
      ctx.restore();
    },
    /** The form a (possibly morphing) state mostly looks like. */
    dominant(s) { return s.to && clamp(s.k) >= 0.5 ? s.to : s.form; },
    /** Blend a handoff state (from the previous act, pure form) into a target layout state (pure form).
     *  k: 0 → exactly the handoff, 1 → exactly the target. Form morphs handoff.form → target.form. */
    blend(handoff, target, k) {
      const h = this.state(handoff), t = this.state(target);
      k = clamp(k, 0, 1.05); // allow the spring's tiny overshoot on position/size
      const kk = clamp(k);
      const from = h.to && clamp(h.k) >= 0.5 ? h.to : h.form; // handoffs should be pure forms
      return this.state({
        ...t,
        x: lerp(h.x, t.x, k), y: lerp(h.y, t.y, k), size: lerp(h.size, t.size, k), rot: lerp(h.rot, t.rot, kk),
        energy: lerp(h.energy, t.energy, kk), amp: lerp(h.amp, t.amp, kk), alpha: lerp(h.alpha, t.alpha, kk), lw: lerp(h.lw, t.lw, kk),
        form: from, to: from === t.form ? null : t.form, k: from === t.form ? 0 : kk,
        tint: kk < 0.5 ? h.tint : t.tint, phase: t.phase, cycles: t.cycles || h.cycles, seed: t.seed || h.seed, aspect: t.aspect || h.aspect,
      });
    },
  };

  /* ------------------------------------------------------------------ background */
  let scanlineTile = null;
  L.bg = {
    draw(ctx, t) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
      // faint geodetic graticule, drifting slowly (screen space, continuous across cuts)
      const sp = 120, ox = (t * 6) % sp, oy = (t * 3.5) % sp;
      ctx.strokeStyle = 'rgba(0,229,255,0.035)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = -sp + ox; x < W + sp; x += sp) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, H); }
      for (let y = -sp + oy; y < H + sp; y += sp) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(W, Math.round(y) + 0.5); }
      ctx.stroke();
      // tick crosses on intersections every other cell
      ctx.fillStyle = 'rgba(0,229,255,0.07)';
      for (let x = -sp + ox; x < W + sp; x += sp * 2) for (let y = -sp + oy; y < H + sp; y += sp * 2) { ctx.fillRect(Math.round(x) - 4, Math.round(y), 9, 1); ctx.fillRect(Math.round(x), Math.round(y) - 4, 1, 9); }
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 1.05);
      g.addColorStop(0, 'rgba(22,31,48,0.35)'); g.addColorStop(1, 'rgba(3,6,12,0.55)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    },
    post(ctx) {
      if (!scanlineTile) {
        scanlineTile = L.canvas(W, H);
        const c = scanlineTile.getContext('2d');
        c.fillStyle = 'rgba(0,0,0,0.06)';
        for (let y = 0; y < H; y += 3) c.fillRect(0, y, W, 1);
      }
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(scanlineTile, 0, 0); ctx.restore();
    },
  };

  /* ------------------------------------------------------------------ HUD (global, screen space) */
  const fmtT = (t) => { const s = Math.max(0, t); const m = Math.floor(s / 60); const r = s - m * 60; return `${String(m).padStart(2, '0')}:${r.toFixed(2).padStart(5, '0')}`; };
  L.hud = {
    /** HUD visibility 0..1 */
    vis(t) { return L.inout(t, L.HUD_WINDOW[0], L.HUD_WINDOW[1], 1.0, 0.75); },
    phaseAt(t) { return L.PHASES.find((p) => t >= p.t0 && t < p.t1) || null; },
    draw(ctx, t) {
      const v = this.vis(t);
      if (v <= 0) return;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const ph = this.phaseAt(t);
      const findings = t >= 48 && t < 52;
      // --- top-left: phase header (re-reveals on every phase change)
      if (ph || findings) {
        const t0 = findings ? 48 : ph.t0, t1 = findings ? 52 : ph.t1;
        const pin = Math.min(v, L.inout(t, t0, t1 + (t1 >= 52 ? 0 : 0.0001), 0.6, t1 >= 52 ? 0.75 : 0.3));
        const col = findings ? C.crimson : ph.color;
        const label = findings ? 'RESULT · CABANATUAN CITY SUBSIDENCE' : ph.label;
        const tag = findings ? 'FINDINGS' : `PHASE ${String(ph.n).padStart(2, '0')}/06`;
        ctx.fillStyle = L.rgba(col, 0.95 * pin);
        ctx.fillRect(96, 62, 10 * clamp(pin * 2), 26);
        const b = L.text(ctx, tag, 118, 82, { kind: 'mono', size: 17, weight: 600, color: L.ink(col), p: pin, tracking: 0.08, role: 'hud', id: 'hud-tag', scanColor: col });
        L.text(ctx, label, 118 + b.w + 18, 83, { kind: 'display', size: 26, weight: 600, color: C.text, p: clamp(pin * 1.1 - 0.05), tracking: 0.02, role: 'hud', id: 'hud-phase', scanColor: col });
      }
      // --- top-right: wordmark + radar readout
      L.text(ctx, [{ s: 'L', color: C.cyan }, { s: 'In', color: C.text }, { s: 'O', color: C.cyan }, { s: 'G', color: C.cyan }], 1824, 86, { kind: 'display', size: 28, weight: 700, align: 'right', p: v, role: 'hud', id: 'hud-logo' });
      L.text(ctx, `ALOS-1 PALSAR · L-BAND λ 23.6 cm · T+${fmtT(t)}`, 1824, 112, { kind: 'mono', size: 14, weight: 400, color: C.textDim, align: 'right', p: v, role: 'hud', id: 'hud-readout' });
      // --- bottom: 6-phase pipeline tracker
      const x0 = 96, x1 = 1824, gap = 14, y = 1004, n = L.PHASES.length;
      const segW = (x1 - x0 - gap * (n - 1)) / n;
      L.PHASES.forEach((p, i) => {
        const sx = x0 + i * (segW + gap);
        const reveal = clamp(v * 1.6 - i * 0.1);
        if (reveal <= 0) return;
        const done = t >= p.t1, active = t >= p.t0 && t < p.t1;
        const prog = done ? 1 : active ? (t - p.t0) / (p.t1 - p.t0) : 0;
        ctx.fillStyle = L.rgba(p.color, 0.18 * reveal);
        ctx.fillRect(sx, y + 14, segW * reveal, 3);
        if (prog > 0) { ctx.fillStyle = L.rgba(p.color, (active ? 1 : 0.55) * reveal); ctx.fillRect(sx, y + 14, segW * prog * reveal, 3); }
        if (active) L.glow(ctx, sx + segW * prog, y + 15.5, 16, p.color, 0.8 * reveal * (0.6 + 0.4 * L.pulse(t)));
        const col = active ? L.ink(p.color) : done ? '#C3D0E2' : C.textDim;
        L.text(ctx, `${String(p.n).padStart(2, '0')}  ${p.short}`, sx, y, { kind: 'mono', size: 14, weight: active ? 600 : 400, color: col, p: reveal, tracking: 0.06, alpha: active ? 1 : done ? 0.85 : 0.75, role: 'hud', id: `hud-ph${p.n}` });
      });
      ctx.restore();
    },
  };
})();

</script>
<script>/* src/geo.js */
/* LInOG explainer — geography: Natural Earth coastlines, Luzon projection, orthographic globe,
 * places, schematic fault traces, ALOS-1 path footprints, land mask and a procedural DEM.
 * Coastlines are real (Natural Earth 10 m via world-atlas, public domain). The DEM, fault traces
 * and footprints are schematic illustrations, not survey data.
 */
(function () {
  'use strict';
  const L = window.LINOG, D = window.GEO_DATA, TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const K = Math.cos(15.5 * DEG); // x compression for a Luzon-centred equirectangular view
  const G = (L.geo = { K });

  function ringsToPath(rings, kx = K) {
    const p = new Path2D();
    for (const r of rings) {
      p.moveTo(r[0] * kx, -r[1]);
      for (let i = 2; i < r.length; i += 2) p.lineTo(r[i] * kx, -r[i + 1]);
      p.closePath();
    }
    return p;
  }
  G.rings = { ph: D.ph, luzon: [D.ph[0]], region: D.region, world: D.world };
  const PATHS = { ph: ringsToPath(D.ph), luzon: ringsToPath([D.ph[0]]), region: ringsToPath(D.region) };
  G.paths = PATHS;

  /** A map view. lon/lat = centre, ppd = pixels per degree of latitude, cx/cy = screen anchor of the centre. */
  G.view = (v) => {
    const s = v.ppd, cx = v.cx === undefined ? L.W / 2 : v.cx, cy = v.cy === undefined ? L.H / 2 : v.cy;
    const lon0 = v.lon, lat0 = v.lat;
    return {
      lon: lon0, lat: lat0, ppd: s, cx, cy,
      x: (lon) => cx + (lon - lon0) * K * s,
      y: (lat) => cy - (lat - lat0) * s,
      pt: (lon, lat) => [cx + (lon - lon0) * K * s, cy - (lat - lat0) * s],
      inv: (x, y) => [lon0 + (x - cx) / (K * s), lat0 - (y - cy) / s],
      /** km → px at this scale (1° lat ≈ 111.32 km) */
      km: (km) => (km / 111.32) * s,
      /** Apply to ctx so Path2D geo paths (X = lon·K, Y = −lat) land in screen space. */
      apply(ctx) { ctx.transform(s, 0, 0, s, cx - lon0 * K * s, cy + lat0 * s); },
      unit: 1 / s,
    };
  };
  /** Fill/stroke land. o: {which:'ph'|'luzon'|'region', fill, stroke, lw (px), alpha} */
  G.drawLand = (ctx, view, o = {}) => {
    const path = PATHS[o.which || 'ph'];
    ctx.save();
    if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
    view.apply(ctx);
    if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(path); }
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = (o.lw || 1.5) * view.unit; ctx.strokeStyle = o.stroke; ctx.stroke(path); }
    ctx.restore();
  };
  /** Clip subsequent drawing to land (call inside ctx.save()/restore()). */
  G.clipLand = (ctx, view, which = 'ph') => {
    ctx.save(); view.apply(ctx);
    const m = ctx.getTransform(); ctx.restore();
    const p = new Path2D(); p.addPath(PATHS[which], m);
    ctx.clip(p);
  };
  /** Lon/lat graticule lines for a view (every `step` degrees). */
  G.graticule = (ctx, view, step = 1, color = 'rgba(0,229,255,0.08)', lw = 1) => {
    const [lonA, latA] = view.inv(0, L.H), [lonB, latB] = view.inv(L.W, 0);
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
    for (let lon = Math.ceil(lonA / step) * step; lon <= lonB; lon += step) { const x = view.x(lon); ctx.moveTo(x, 0); ctx.lineTo(x, L.H); }
    for (let lat = Math.ceil(latA / step) * step; lat <= latB; lat += step) { const y = view.y(lat); ctx.moveTo(0, y); ctx.lineTo(L.W, y); }
    ctx.stroke(); ctx.restore();
  };

  /* --------------------------------------------------------------- places, faults, footprints */
  G.places = {
    cabanatuan: { lon: 120.967, lat: 15.486, name: 'Cabanatuan City' },
    manila: { lon: 120.984, lat: 14.599, name: 'Manila' },
    baguio: { lon: 120.593, lat: 16.402, name: 'Baguio' },
    laTrinidad: { lon: 120.59, lat: 16.46, name: 'La Trinidad' },
    dagupan: { lon: 120.333, lat: 16.043, name: 'Dagupan City' },
    sanJose: { lon: 120.99, lat: 15.79, name: 'San Jose City' },
    gabaldon: { lon: 121.34, lat: 15.45, name: 'Gabaldon' },

<script>/* src/assets.js */
/* LInOG explainer — procedural assets: ALOS-1 satellite vector, SAR amplitude textures,

  /** Simple camera: yaw/pitch about the origin, then perspective. Returns project(x,y,z) -> [sx, sy, depth, scale]. */
  L.persp = (o) => {
    const cy = Math.cos(o.yaw || 0), sy = Math.sin(o.yaw || 0), cp = Math.cos(o.pitch || 0), spp = Math.sin(o.pitch || 0);
    const dist = o.dist || 1200, f = o.f || 1000, cx0 = o.cx === undefined ? L.W / 2 : o.cx, cy0 = o.cy === undefined ? L.H / 2 : o.cy;
    return (x, y, z) => {
      const x1 = x * cy - y * sy, y1 = x * sy + y * cy; // yaw about vertical (z up), y = depth axis on the ground
      const y2 = y1 * cp - z * spp, z2 = y1 * spp + z * cp; // pitch
      const d = dist + y2, k = f / d;
      return [cx0 + x1 * k, cy0 - z2 * k, d, k];
    };
  };

  /* --------------------------------------------------------------- EGG Lab emblem (procedural placeholder) */
  /** Placeholder mark for the UP NIGS Earthquake Geodesy and Geology (EGG) Laboratory — NOT an official logo.
   *  An egg-shaped geoid with a fault offset, wrapped by two orbital rings. o: {x, y, r, p, t, ringsOnly} */
  L.drawEGG = (ctx, o) => {
    const r = o.r || 120, p = o.p === undefined ? 1 : o.p, t = o.t || 0;
    ctx.save(); ctx.translate(o.x, o.y);
    const egg = (k) => { ctx.beginPath(); for (let i = 0; i <= 96; i++) { const th = (i / 96) * TAU; const rr = r * 0.62 * (1 + 0.1 * Math.sin(th)); const xx = Math.cos(th) * rr * 0.86, yy = Math.sin(th) * rr * k; i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.closePath(); };
    const pe = L.clamp(p * 1.6 - 0.3);
    if (!o.ringsOnly && pe > 0) {
      ctx.save(); ctx.globalAlpha *= pe;
      egg(1.0);
      const g = ctx.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.05, 0, 0, r * 0.7);
      g.addColorStop(0, '#1F3B57'); g.addColorStop(1, '#0F1D30');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = L.rgba(C.cyan, 0.9); ctx.lineWidth = 2.2; ctx.stroke();
      ctx.clip();
      // stratified "geology" bands with a fault offset (left-lateral strike-slip hint)
      for (let i = -4; i <= 4; i++) {
        const yy = i * r * 0.13;
        ctx.strokeStyle = L.css(L.fringeRGB(i * 0.9 + t * 0.6), 0.55); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-r, yy - r * 0.05); ctx.lineTo(-r * 0.05, yy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r * 0.05, yy + r * 0.07); ctx.lineTo(r, yy + r * 0.12); ctx.stroke();
      }
      ctx.strokeStyle = L.rgba(C.crimson, 0.95); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-r * 0.12, -r); ctx.lineTo(r * 0.12, r); ctx.stroke();
      ctx.restore();
    }
    // two orbital rings
    for (let k = 0; k < 2; k++) {
      const pk = L.clamp(p * 1.4 - k * 0.2);
      if (pk <= 0) continue;
      const rot = k === 0 ? -0.42 : 0.42, rx = r * (1.02 + k * 0.08), ry = r * 0.3;
      ctx.save(); ctx.rotate(rot);
      ctx.strokeStyle = L.rgba(k ? C.gold : C.cyan, 0.9); ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, Math.PI, Math.PI + TAU * pk); ctx.stroke();
      const a = t * (k ? -1.6 : 1.2) + k;
      ctx.fillStyle = k ? C.gold : C.cyan;
      if (pk >= 1) { ctx.beginPath(); ctx.arc(Math.cos(a) * rx, Math.sin(a) * ry, 5, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
    ctx.restore();
  };
})();

<script>/* src/audio.js */
/* LInOG explainer — original 60 s, 120 BPM soundtrack synthesised with the Web Audio API.
 * OfflineAudioContext, 44.1 kHz stereo, exactly 60.000 s. All noise comes from a seeded PRNG,
 * so the render is reproducible. Exported as 16-bit PCM WAV.
 *
 * Arrangement (bars of 2.0 s, D minor: Dm – B♭ – F – C, two bars per chord):
 *   kick on every quarter note (0.0 … 59.5 s)
 *   sub-bass impacts + noise risers on act changes (10, 18, 30, 42, 52) and the end card (56)
 *   radar ping-sweeps on each pipeline phase transition
 *   rolling 16th bass from 10 s, 16th arp from 18 s, pad throughout, hats/clap build with the acts.
 */
(function () {
  'use strict';
  const L = window.LINOG;
  const SR = 44100, DUR = 60, BEAT = 0.5;
  const ACT_HITS = [10, 18, 30, 42, 52, 56];
  const PINGS = [0.0, 4.0, 10, 14, 18, 22, 26, 30, 36, 42, 48, 52];
  const CHORDS = [
    { root: 38, tones: [62, 65, 69] }, // Dm
    { root: 34, tones: [58, 62, 65] }, // B♭
    { root: 41, tones: [60, 65, 69] }, // F
    { root: 36, tones: [60, 64, 67] }, // C
  ];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const chordAt = (t) => CHORDS[Math.floor(Math.floor(t / 2) / 2) % 4];

  function build(ctx) {
    const rnd = L.rng(20250317);
    // shared seeded noise buffer
    const nb = ctx.createBuffer(2, SR * 2, SR);
    for (let c = 0; c < 2; c++) { const d = nb.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
    // reverb impulse (seeded, exponentially decaying)
    const ir = ctx.createBuffer(2, SR * 2.4, SR);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }

    // Master: gain → tanh soft-clipper → end fade → out. No DynamicsCompressor: its ~6 ms look-ahead
    // would delay the whole mix against the picture and push audio past the final fade.
    const master = ctx.createGain(); master.gain.value = 0.62;
    const clip = ctx.createWaveShaper(); clip.oversample = 'none';
    const curve = new Float32Array(4097); for (let i = 0; i < curve.length; i++) { const x = (i / 2048) - 1; curve[i] = Math.tanh(1.6 * x) / Math.tanh(1.6); }
    clip.curve = curve;
    const fade = ctx.createGain(); fade.gain.value = 1;
    // hard stop at 60.000 s: 10 ms fade to silence so the last sample is 0 (no click)
    fade.gain.setValueAtTime(1, DUR - 0.01); fade.gain.linearRampToValueAtTime(0, DUR);
    master.connect(clip); clip.connect(fade); fade.connect(ctx.destination);

    const verb = ctx.createConvolver(); verb.buffer = ir; const verbOut = ctx.createGain(); verbOut.gain.value = 0.32; verb.connect(verbOut); verbOut.connect(master);
    // ping-pong delay (dotted eighth = 0.375 s)
    const dl = ctx.createDelay(1), dr = ctx.createDelay(1); dl.delayTime.value = 0.375; dr.delayTime.value = 0.375;
    const fb = ctx.createGain(); fb.gain.value = 0.38; const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 3200;
    const merger = ctx.createChannelMerger(2); const delayIn = ctx.createGain();
    delayIn.connect(dl); dl.connect(dlp); dlp.connect(dr); dr.connect(fb); fb.connect(dl);
    dl.connect(merger, 0, 0); dr.connect(merger, 0, 1); const delayOut = ctx.createGain(); delayOut.gain.value = 0.5; merger.connect(delayOut); delayOut.connect(master);

    const drums = ctx.createGain(); drums.gain.value = 0.95; drums.connect(master);
    const music = ctx.createGain(); music.gain.value = 1; music.connect(master);
    const musicSend = ctx.createGain(); musicSend.gain.value = 0.35; music.connect(musicSend); musicSend.connect(verb);
    // sidechain: duck the music bus on every kick
    for (let i = 0; i < DUR / BEAT; i++) {
      const tb = i * BEAT;
      music.gain.setValueAtTime(0.38, tb);
      music.gain.setTargetAtTime(1, tb + 0.02, 0.085);
    }

    const noise = (t, dur, dest, o = {}) => {
      const src = ctx.createBufferSource(); src.buffer = nb; src.loop = true;
      const g = ctx.createGain(); g.gain.value = 0;
      let node = src;
      if (o.type) { const f = ctx.createBiquadFilter(); f.type = o.type; f.frequency.value = o.freq || 1000; f.Q.value = o.q || 0.7; if (o.sweep) { f.frequency.setValueAtTime(o.sweep[0], t); f.frequency.exponentialRampToValueAtTime(o.sweep[1], t + dur); } node.connect(f); node = f; }
      node.connect(g); g.connect(dest);

    };

    /* ---- kick: every quarter note */
    for (let i = 0; i < DUR / BEAT; i++) {
      const t = i * BEAT;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.09); o.frequency.exponentialRampToValueAtTime(40, t + 0.4);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.0, t + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
      o.connect(g); g.connect(drums); o.start(t); o.stop(t + 0.45);
      const ck = noise(t, 0.012, drums, { type: 'highpass', freq: 2500, offset: i * 0.013 });
      ck.g.gain.setValueAtTime(0.35, t); ck.g.gain.exponentialRampToValueAtTime(0.001, t + 0.012); ck.start();
    }
    /* ---- hats: offbeat 8ths from 4 s, 16ths from 30 s to 52 s */
    for (let s = 0; s < DUR / 0.125; s++) {
      const t = s * 0.125, pos = s % 4;
      let on = false, vel = 0;
      if (t >= 4 && pos === 2) { on = true; vel = 0.22; }
      if (t >= 30 && t < 52 && (pos === 1 || pos === 3)) { on = true; vel = 0.09; }
      if (!on || t >= 59.9) continue;
      const open = t >= 18 && t < 52 && pos === 2 && Math.floor(t / 0.5) % 2 === 1;
      const h = noise(t, open ? 0.2 : 0.05, drums, { type: 'highpass', freq: 7600, offset: s * 0.037 });
      h.g.gain.setValueAtTime(vel, t); h.g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.18 : 0.045)); h.start();
    }
    /* ---- clap on beats 2 & 4 from 10 s */
    for (let i = 0; i < DUR / BEAT; i++) {
      const t = i * BEAT;
      if (t < 10 || i % 2 === 0 || t >= 59.9) continue;
      for (let k = 0; k < 3; k++) {
        const tt = t + k * 0.011;
        const c = noise(tt, 0.12, drums, { type: 'bandpass', freq: 1300, q: 1.2, offset: i * 0.071 + k * 0.2 });
        c.g.gain.setValueAtTime(k === 2 ? 0.32 : 0.18, tt); c.g.gain.exponentialRampToValueAtTime(0.001, tt + (k === 2 ? 0.12 : 0.012)); c.start();
      }
    }
    /* ---- sub drone (0–10 s), then rolling 16th bass */
    {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(26); // D1
      const g = ctx.createGain(); g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(0.32, 1.5); g.gain.setValueAtTime(0.32, 9.0); g.gain.linearRampToValueAtTime(0, 10.2);
      o.connect(g); g.connect(music); o.start(0); o.stop(10.3);
    }
    for (let s = 0; s < DUR / 0.125; s++) {
      const t = s * 0.125, pos = s % 4;
      if (t < 6 || t >= 59.9) continue;
      const rolling = t >= 10;
      if (!rolling && pos !== 2) continue; // offbeat 8ths in the build (6–10 s)
      if (rolling && pos === 0) continue; // leave the downbeat to the kick
      const ch = chordAt(t);
      const m = ch.root + (rolling && pos === 3 && (s >> 2) % 4 === 3 ? 12 : 0);
      const f = mtof(m);
      const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
      const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = f / 2;
      const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.Q.value = 6;
      const peak = t >= 30 && t < 52 ? 1500 : 950;
      flt.frequency.setValueAtTime(160, t); flt.frequency.exponentialRampToValueAtTime(peak, t + 0.012); flt.frequency.exponentialRampToValueAtTime(190, t + 0.11);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.26, t + 0.006); g.gain.exponentialRampToValueAtTime(0.001, t + 0.115);
      const g2 = ctx.createGain(); g2.gain.value = 0.5;
      o1.connect(flt); o2.connect(g2); g2.connect(flt); flt.connect(g); g.connect(music);
      o1.start(t); o2.start(t); o1.stop(t + 0.13); o2.stop(t + 0.13);
    }
    /* ---- pad: detuned saws per chord, filter opening with the acts */
    for (let c = 0; c < DUR / 4; c++) {
      const t = c * 4, ch = chordAt(t);
      const end = Math.min(DUR, t + 4.25);
      const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.Q.value = 0.8;
      const cut = t < 4 ? 500 : t < 10 ? 800 : t < 30 ? 1100 : t < 52 ? 1500 : 2600;
      flt.frequency.setValueAtTime(cut * 0.7, t); flt.frequency.linearRampToValueAtTime(cut, t + 2);
      const g = ctx.createGain(); const lvl = t < 4 ? 0.05 : t >= 52 ? 0.11 : 0.075;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(lvl, t + 0.6); g.gain.setValueAtTime(lvl, end - 0.45); g.gain.linearRampToValueAtTime(0.0001, end);
      flt.connect(g); g.connect(music);
      const tones = ch.tones.concat([ch.root + 24]);
      for (const m of tones) for (const det of [-7, 7]) {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
        o.connect(flt); o.start(t); o.stop(end);
      }
    }
    /* ---- 16th arp (18–56 s), plucky, into the ping-pong delay */
    for (let s = 0; s < DUR / 0.125; s++) {
      const t = s * 0.125;
      if (t < 18 || t >= 56) continue;
      const ch = chordAt(t), seq = [0, 1, 2, 3, 2, 1, 0, 2];
      const idx = seq[s % 8];
      const m = idx === 3 ? ch.tones[0] + 12 : ch.tones[idx] + 12;
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m);
      const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = mtof(m); o2.detune.value = 5;
      const g = ctx.createGain(); const v = (s % 4 === 0 ? 0.075 : 0.05) * (t >= 30 && t < 52 ? 1.15 : 1);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0008, t + 0.14);
      const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 2800; const g2 = ctx.createGain(); g2.gain.value = 0.25;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(flt); flt.connect(music); flt.connect(delayIn);
      o.start(t); o2.start(t); o.stop(t + 0.16); o2.stop(t + 0.16);
    }
    /* ---- radar ping-sweeps on phase transitions */
    PINGS.forEach((t, i) => {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(620, t); o.frequency.exponentialRampToValueAtTime(2640, t + 0.07); o.frequency.exponentialRampToValueAtTime(1760, t + 0.16);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
      const pan = ctx.createStereoPanner(); pan.pan.value = i % 2 ? 0.35 : -0.35;
      o.connect(g); g.connect(pan); pan.connect(master); pan.connect(delayIn); pan.connect(verb);
      o.start(t); o.stop(t + 1);
    });
    /* ---- risers into each act change + sub-bass impacts */
    ACT_HITS.forEach((t) => {
      const rise = 2.0;
      if (t - rise >= 0) {
        const r = noise(t - rise, rise, music, { type: 'bandpass', freq: 400, q: 1.4, sweep: [300, 7000], offset: t * 0.11 });
        r.g.gain.setValueAtTime(0.0001, t - rise); r.g.gain.exponentialRampToValueAtTime(0.16, t - 0.02); r.g.gain.linearRampToValueAtTime(0.0001, t); r.start();
      }
      const big = t === 56 ? 1.15 : 1;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(30, t + 1.2);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.75 * big, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
      o.connect(g); g.connect(drums); o.start(t); o.stop(Math.min(DUR, t + 1.9));
      const w = noise(t, 1.2, verb, { type: 'lowpass', freq: 1800, sweep: [5000, 200], offset: t * 0.07 });
      w.g.gain.setValueAtTime(0.4 * big, t); w.g.gain.exponentialRampToValueAtTime(0.001, t + 1.2); w.start();
    });
  }

  function floatToWav(buf) {
    const ch = buf.numberOfChannels, n = buf.length, bytes = n * ch * 2;
    const ab = new ArrayBuffer(44 + bytes), dv = new DataView(ab);
    const wr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    wr(0, 'RIFF'); dv.setUint32(4, 36 + bytes, true); wr(8, 'WAVE'); wr(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true); dv.setUint32(24, buf.sampleRate, true);
    dv.setUint32(28, buf.sampleRate * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true);
    wr(36, 'data'); dv.setUint32(40, bytes, true);
    const data = []; for (let c = 0; c < ch; c++) data.push(buf.getChannelData(c));
    let peak = 0; for (const d of data) for (let i = 0; i < n; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
    const gain = peak > 0 ? Math.min(4, 0.891 / peak) : 1; // normalise to −1 dBFS
    const rnd = L.rng(44100);
    let o = 44;
    for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
      const dither = (rnd() - rnd()) / 32768; // TPDF, seeded
      let v = data[c][i] * gain + (i < n - 1 ? dither : 0); // final sample exactly 0
      v = Math.max(-1, Math.min(1, v));
      dv.setInt16(o, v < 0 ? v * 32768 : v * 32767, true); o += 2;
    }
    return ab;
  }

  let cached = null;
  L.audio = {
    SR, DUR,
    /** Render the soundtrack. Resolves to an AudioBuffer (2 ch, 44.1 kHz, 2,646,000 frames). */
    render() {
      if (cached) return cached;
      const ctx = new OfflineAudioContext(2, SR * DUR, SR);
      build(ctx);
      cached = ctx.startRendering();
      return cached;
    },
    wav: floatToWav,
    async wavBase64() {
      const ab = floatToWav(await this.render());
      const u8 = new Uint8Array(ab); let s = '';
      for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
      return btoa(s);
    },
  };
})();

<script>/* src/scenes/act1.js */
/* Act 1 · The hook & mission (0–10 s, bars 1–5). No HUD. Camera sections [0,4] and [4,10].
 *
 * Beat plan (local = global time; 1 beat = 0.5 s, 1 bar = 2 s):
 *  A · bars 1–2 · kinetic type "THE EARTH NEVER / STOPS MOVING." (Space Grotesk 700, 136 px)
 *   0.00  TL (cyan L-band pulse) is already gliding in from the left on the line-2 cut height
 *         (pre-rolled spring), trailing a faint flat trace — visible from frame 0.
 *   0.50  "THE" scans in; the λ bracket draws on under the pulse, trough → trough (= one wavelength).
 *   1.00  "EARTH" + mono callout "L-BAND · λ = 23.6 cm" · 1.50 "NEVER".
 *   2.00  bar 2: "STOPS" lands and the pulse launches (velocity spring 2.0, brake on beat 3.5). From
 *         here its carrier is phase-locked to a world-fixed sine, so the cut it leaves behind IS its own
 *         wave: line 2 splits along that sine (upper half lifts 3 px / shears left, lower half drops /
 *         shears right, continuous affine ramp — no strips), thin cyan seam in the 6 px gap.
 *         The callout stays parked: its bracket now spans one wavelength of the seam left behind.
 *   2.50  "MOVING." lands (0.3 s); the packet's leading edge only reaches it at ~2.97 s.
 *   3.50  callout unmasks; the pulse brakes and parks right of the type (~3.8 s).
 *  B · bars 3–5 · pull out to low Earth orbit (one shared zoom curve)
 *   4.00  bar 3: the camera leaves the surface — the type shrinks into central Luzon while the globe
 *         unmasks from that point (iris 0.5 s) and its radius springs 5× → 1× (log, 1.5 s); line 1
 *         unmasks at 4.0, line 2 at 4.25 (gone by ~4.6). Oblique view from the SSE, north ≈ up.
 *   4.50  ALOS-1 builds on its projected great-circle orbit; the TL lifts off and arcs (above the
 *         receding type) into the antenna's beam. Geometry is physical: sub-satellite point 4.36° WSW
 *         of the footprint (right-looking, ascending), altitude 0.1086 R (691.65 km), PALSAR face square
 *         to the beam; satellite and footprint advance north together.
 *   4.5–5.5 cloud streets condense (staggered on beats) over the South China Sea, off the Ilocos coast
 *         (right under the beam's last third), the Philippine Sea and — thin, capped over land — central
 *         Luzon; they drift slowly west. Earth itself does not spin in this shot.
 *   5.50  beam reaches down from the antenna; one bright wavefront leaves on every quarter note and lands
 *         on the next (ground ripple). The lower beam runs UNDER the cloud deck and its wavefronts and
 *         ripples glow through it. Caption "ALOS-1 PALSAR · ASCENDING PASS" (+ 6.0 "L-band radar
 *         penetrates cloud cover", the report's cloud-penetration point).
 *   6.00  bar 4: first wavefront lands — footprint + imaged path-448 strip start (SAR texture seen through
 *         a window cut in the clouds, growing north). "Project LInOG" scans in (top-left, in space);
 *         6.5 subtitle (2 lines); 7.0 lab eyebrow above the title.
 *   7.0–8.5 acronym decode on quarter notes: L · In · O · G turn cyan in the subtitle, with ticks.
 *   9.00  captions, title, orbit unmask; satellite un-builds; the TL travels down the beam (the beam
 *         drains completely behind it), rotating to horizontal and growing.
 *   9.50  an iris contracts onto the footprint (globe, clouds, strip) — closed by ~9.85.
 *  10.00  only the TL remains: pure 'pulse', rot 0, size 112, centre ≈ (1200, 610) — hand-off to act 2.
 */
(function () {
  'use strict';
  const L = window.LINOG, C = L.C, G = L.geo, TAU = Math.PI * 2, DEG = Math.PI / 180;
  const DUR = 10;
  const clamp = L.clamp, lerp = L.lerp;

  /* ================================================================ shared helpers */
  let _mctx = null;
  const mctx = () => _mctx || (_mctx = L.canvas(8, 8).getContext('2d'));
  /** Our own camera (identical to the runtime's for t < 10) so the hand-off measured at lt = dur
   *  uses this act's camera, not act 2's. */
  const camAt = (t) => L.cam(Math.min(t, DUR - 1e-6));
  /** Interlaced scanline clip (same look as core text reveals). */
  function scanClip(ctx, x, y, w, h, p, rowH = 3) {
    const rows = Math.max(1, Math.ceil(h / rowH));
    const f1 = clamp(p * 2), f2 = clamp(p * 2 - 1);
    ctx.beginPath();
    for (let i = 0; i < rows; i++) {
      const fr = (i + 0.5) / rows;
      if (fr <= (i % 2 === 0 ? f1 : f2)) ctx.rect(x, y + i * rowH, w, rowH + 0.6);
    }
    ctx.clip();
  }
  function scanBar(ctx, x, y, w, h, p, color = C.cyan) {
    if (p <= 0 || p >= 1) return;
    const f = p < 0.5 ? p * 2 : p * 2 - 1, yy = y + h * f, a = 0.8 * Math.sin(Math.PI * p);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = L.rgba(color, a); ctx.fillRect(x, yy - 1, w, 2);
    ctx.fillStyle = L.rgba(color, a * 0.22); ctx.fillRect(x, yy - 6, w, 12);
    ctx.restore();
  }
  /** Smooth beat-locked kick: 0 on the beat, rises in ~1/16 note, decays by the next beat (no jump). */
  function kick(t) {
    const f = (((t / 0.5) % 1) + 1) % 1;
    return (1 - Math.exp(-f * 16)) * Math.exp(-f * 4.2) * 1.62;
  }

  /* ================================================================ A · kinetic type */
  const TYPE = { kind: 'display', size: 136, weight: 700, tracking: -0.01 };
  const WORDS = [
    { s: 'THE', line: 0, at: 0.5 }, { s: 'EARTH', line: 0, at: 1.0 }, { s: 'NEVER', line: 0, at: 1.5 },
    { s: 'STOPS', line: 1, at: 2.0 }, { s: 'MOVING.', line: 1, at: 2.5 },
  ];
  const BASE = [474, 640]; // baselines (world px)
  let TYPE_LAY = null;
  function typeLayout() {
    if (TYPE_LAY) return TYPE_LAY;
    const c = mctx(), out = { words: [] };
    for (let ln = 0; ln < 2; ln++) {
      const ws = WORDS.filter((w) => w.line === ln);
      const full = L.measure(c, ws.map((w) => w.s).join(' '), TYPE);
      const x0 = 960 - full.w / 2;
      ws.forEach((w, i) => {
        const pre = i ? L.measure(c, ws.slice(0, i).map((v) => v.s).join(' ') + ' ', TYPE).w + TYPE.tracking * TYPE.size : 0;
        out.words.push({ ...w, i: WORDS.indexOf(w), x: x0 + pre, w: L.measure(c, w.s, TYPE).w, y: BASE[ln] });
      });
      Object.assign(out, { capH: full.capH, asc: full.asc, desc: full.desc });
    }
    out.cutY = BASE[1] - out.capH * 0.5;
    out.l2x0 = out.words[3].x; out.l2x1 = out.words[4].x + out.words[4].w;
    if (document.fonts && document.fonts.status === 'loaded') TYPE_LAY = out;
    return out;
  }
  const wordIn = (lt, w) => L.sp(lt, w.at, 0.3);
  const wordRise = (lt, w) => 14 * (1 - L.sp(lt, w.at, 0.5));
  const LINE_OUT = [[4.0, 0.4], [4.25, 0.35]];
  const lineOut = (lt, ln) => 1 - L.sp(lt, LINE_OUT[ln][0], LINE_OUT[ln][1]);

  /* sweep progress 0..1: velocity springs up on bar 2 (2.0 s, slow start) and brakes on the beat at 3.5 s.
   * Leading edge reaches STOPS at ~2.5 s (after it landed) and MOVING. at ~2.97 s (after it landed). */
  const SW_N = 400;
  let SWLUT = null;
  const sweepV = (t) => Math.max(0, Math.pow(L.sp(t, 2.0, 1.3), 2) - L.sp(t, 3.5, 0.5));
  function sweepS(lt) {
    if (lt <= 2.0) return 0;
    if (lt >= 4.0) return 1;
    if (!SWLUT) {
      SWLUT = new Float32Array(SW_N + 1);
      let acc = 0; const dt = 2.0 / SW_N;
      for (let i = 1; i <= SW_N; i++) { const ta = 2.0 + (i - 1) * dt; acc += 0.5 * (sweepV(ta) + sweepV(ta + dt)) * dt; SWLUT[i] = acc; }
      for (let i = 0; i <= SW_N; i++) SWLUT[i] /= acc;
    }
    const f = ((lt - 2.0) / 2.0) * SW_N, i = Math.floor(f);
    return lerp(SWLUT[i], SWLUT[Math.min(SW_N, i + 1)], f - i);
  }
  const PA = { size: 110, x0: 40, hold: 270, end: 1600 };
  const LAM = (2 * PA.size) / 3.5;                       // pulse wavelength on screen (cycles 3.5)
  const glideAt = (lt) => lerp(PA.x0, PA.hold, L.sp(lt, -0.42, 2.2)); // pre-rolled: moving at frame 0
  const X0 = glideAt(2.0);                               // where the sweep starts; seam phase origin
  const SEAM_A = 0.088 * PA.size;                        // = packet amplitude 0.8·size behind its centre
  const envQ = (q) => (q > 0 && q < 1 ? Math.pow(Math.sin(Math.PI * q), 1.15) : 0);
  /** The pulse in section A (world coordinates). From 2.0 s its phase keeps the carrier world-fixed:
   *  y = y0 − A·cos(2π(x − X0)/λ), exactly the seam it cuts. Before that it glides rigidly (phase π). */
  function pulseA(lt, t) {
    const lay = typeLayout();
    const s = sweepS(lt);
    const x = lt < 2.0 ? glideAt(lt) : X0 + (PA.end - X0) * s;
    const speed = Math.min(1, sweepV(lt));
    return {
      x, y: lay.cutY, size: PA.size, s, speed,
      amp: 1 + 0.08 * kick(t) + 0.08 * speed,
      phase: lt < 2.0 ? Math.PI : Math.PI - (TAU * (x - X0)) / LAM,
      energy: 0.55 + 0.35 * L.pulse(t) + 0.4 * speed,
    };
  }

  /* the cut that the pulse leaves in line 2 */
  const SPLIT = { gap: 6, shear: 3, R: 0.8 * PA.size, OV: 0.9, NR: 6 };
  function splitState(lt, pa) {
    if (lt < 2.0) return null;
    return { front: pa.x, R: SPLIT.R, y0: pa.y, xStart: X0 - PA.size, breath: 1 + 0.25 * kick(lt) };
  }
  const cutY = (sp, x) => sp.y0 - SEAM_A * Math.cos((TAU * (x - X0)) / LAM);
  const openAt = (sp, x) => L.ease.inOutSine(clamp((sp.front - x) / sp.R));

  function drawWordIn(ctx, w, lt, pMax = 1) {
    const p = Math.min(wordIn(lt, w), pMax);
    if (p <= 0.001) return;
    L.text(ctx, w.s, w.x, w.y + wordRise(lt, w), { ...TYPE, color: C.text, p, id: 'a1-w' + w.i });
  }
  /** One half of line 2 over source range [a, b]: the displacement is linear in x inside the range,
   *  so it is one affine map (shear + scale) — adjacent ranges agree at their shared edge → continuous. */
  function drawHalf(ctx, lt, ws, sp, a, b, upper) {
    const sgn = upper ? -1 : 1, br = sp.breath, OV = SPLIT.OV;
    const oa = openAt(sp, a), ob = openAt(sp, b);
    const dxa = sgn * 0.5 * SPLIT.shear * oa * br, dxb = sgn * 0.5 * SPLIT.shear * ob * br;
    const dya = sgn * 0.5 * SPLIT.gap * oa * br, dyb = sgn * 0.5 * SPLIT.gap * ob * br;
    const kx = (dxb - dxa) / (b - a), ky = (dyb - dya) / (b - a);
    ctx.save();
    ctx.transform(1 + kx, ky, 0, 1, dxa - kx * a, dya - ky * a);
    const yE = upper ? sp.y0 - 240 : sp.y0 + 240, xa = a - OV, xb = b + OV;
    ctx.beginPath(); ctx.moveTo(xa, yE); ctx.lineTo(xb, yE);
    const n = Math.max(2, Math.ceil((xb - xa) / 3));
    for (let i = n; i >= 0; i--) { const x = xa + ((xb - xa) * i) / n; ctx.lineTo(x, cutY(sp, x)); }
    ctx.closePath(); ctx.clip();
    for (const w of ws) if (w.x - 6 < xb && w.x + w.w + 6 > xa) L.text(ctx, w.s, w.x, w.y + wordRise(lt, w), { ...TYPE, color: C.text, role: 'deco' });
    ctx.restore();
  }
  /** QA registry for split words: register the word's true (unsplit) box once, drawing nothing. */
  function registerWords(ctx, lt, ws) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 0, 0); ctx.clip();
    for (const w of ws) L.text(ctx, w.s, w.x, w.y + wordRise(lt, w), { ...TYPE, color: C.text, id: 'a1-w' + w.i });
    ctx.restore();
  }
  function drawLine2(ctx, lt, lay, sp) {
    const ws = lay.words.filter((w) => w.line === 1);
    const pOut = lineOut(lt, 1);
    if (pOut <= 0.001) return;
    const bx = lay.l2x0 - 18, bw = lay.l2x1 - lay.l2x0 + 36, by = BASE[1] - lay.asc - 14, bh = lay.asc + lay.desc + 28;
    ctx.save();
    if (pOut < 1) scanClip(ctx, bx, by, bw, bh, pOut);
    if (!sp) { for (const w of ws) drawWordIn(ctx, w, lt); }
    else {
      // intact, ahead of the cut (words still scanning in keep their own reveal)
      ctx.save(); ctx.beginPath(); ctx.rect(sp.front - SPLIT.OV, by - 60, 4000, bh + 120); ctx.clip();
      for (const w of ws) if (w.x + w.w > sp.front - SPLIT.OV) drawWordIn(ctx, w, lt);
      ctx.restore();
      // split, behind the cut: fully revealed halves, no scan bars inside them
      const x0 = lay.l2x0 - 12, xr = sp.front - sp.R, segs = [];
      if (xr > x0) segs.push([x0 - 8, xr]);
      for (let i = 0; i < SPLIT.NR; i++) {
        const a = xr + (sp.R * i) / SPLIT.NR, b = xr + (sp.R * (i + 1)) / SPLIT.NR;
        if (b > x0) segs.push([Math.max(a, x0 - 8), b]);
      }
      for (const [a, b] of segs) if (b - a > 0.5) { drawHalf(ctx, lt, ws, sp, a, b, true); drawHalf(ctx, lt, ws, sp, a, b, false); }
      if (pOut >= 0.6) registerWords(ctx, lt, ws.filter((w) => w.x < sp.front - SPLIT.OV));
    }
    ctx.restore();
    if (pOut < 1) scanBar(ctx, bx, by, bw, bh, pOut);
  }
  function drawSeam(ctx, lt, sp, pa, aOut) {
    const x1 = pa.x - 0.8 * PA.size;               // the packet's own carrier takes over from here
    const x0 = lerp(sp.xStart, x1, 1 - aOut);       // exit: retracts toward the packet
    if (x1 - x0 < 2 || aOut <= 0.002) return;
    const pts = [];
    for (let x = x0; x < x1; x += 2.5) pts.push([x, cutY(sp, x)]);
    pts.push([x1, cutY(sp, x1)]);
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';
    L.poly(ctx, pts); ctx.strokeStyle = L.rgba(C.cyan, 0.16 * aOut); ctx.lineWidth = 4.5; ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    L.poly(ctx, pts); ctx.strokeStyle = L.rgba(C.cyan, 0.92 * aOut); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }
  /* the flat trace the packet has travelled along (left edge → packet tail); the seam continues it */
  function drawTrail(ctx, lt, pa, aOut) {
    if (aOut <= 0.002) return;
    const xEnd = lt < 2.0 ? pa.x - pa.size : X0 - PA.size;
    const x0 = lerp(-80, xEnd, 1 - aOut);
    if (xEnd - x0 < 2) return;
    const g = ctx.createLinearGradient(x0, 0, xEnd, 0);
    g.addColorStop(0, L.rgba(C.cyan, 0)); g.addColorStop(1, L.rgba(C.cyan, 0.42 * aOut));
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(x0, pa.y - 0.75, xEnd - x0, 1.5); ctx.restore();
  }
  /* λ bracket + callout, parked where the pulse rests in bar 1 (it rides the slow glide, never the sweep) */
  const CALL = { yB: 682, yT: 728 };
  function drawCallout(ctx, lt, pa) {
    const pOut = 1 - L.sp(lt, 3.5, 0.4);
    const pb = Math.min(L.sp(lt, 0.5, 0.5), pOut);
    if (pb <= 0.001) return;
    const bx = lt < 2.0 ? pa.x : X0;
    const xa = bx - LAM / 2, xb = bx + LAM / 2;
    // trough depth below the cut height: the packet's own envelope (its carrier is phase-locked), or the seam left behind
    const depth = (x) => {
      let d = PA.size * pa.amp * 0.34 * envQ((x - pa.x + PA.size) / (2 * PA.size));
      if (lt >= 2.0 && x <= pa.x - 0.8 * PA.size) d = Math.max(d, SEAM_A);
      return d;
    };
    ctx.save();
    ctx.strokeStyle = L.rgba(C.cyan, 0.9); ctx.lineWidth = 1.5; ctx.lineCap = 'butt';
    ctx.setLineDash([2, 3]);
    for (const x of [xa, xb]) {
      const yTr = pa.y + depth(x) + 5;
      ctx.globalAlpha = pb;
      ctx.beginPath(); ctx.moveTo(x, yTr); ctx.lineTo(x, lerp(yTr, CALL.yB, pb)); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    const half = (LAM / 2) * pb;
    L.poly(ctx, [[bx - half, CALL.yB - 7 * pb], [bx - half, CALL.yB], [bx + half, CALL.yB], [bx + half, CALL.yB - 7 * pb]]);
    ctx.stroke();
    const pl = Math.min(L.sp(lt, 1.0, 0.4), pOut);
    if (pl > 0.001) { ctx.beginPath(); ctx.moveTo(bx, CALL.yB); ctx.lineTo(bx, lerp(CALL.yB, CALL.yT - 26, pl)); ctx.strokeStyle = L.rgba(C.cyan, 0.55); ctx.stroke(); }
    ctx.restore();
    const pt = Math.min(L.sp(lt, 1.0, 0.45), pOut);
    if (pt > 0.001) {
      L.text(ctx, [{ s: 'L-BAND', color: C.cyan }, { s: ' · λ = 23.6 cm', color: C.text }], bx, CALL.yT, { kind: 'mono', size: 22, weight: 600, align: 'center', p: pt, tracking: 0.02, id: 'a1-lband' });
    }
  }

  /* ================================================================ B · low Earth orbit */
  /* Oblique orthographic view from the SSE (north ≈ up). Central Luzon sits at ρ ≈ 0.87 of the disc, so
   * the limb and a thin atmosphere arc across the top-left (space for the title) — the classic LEO look.
   * The view orientation never changes (Earth does not spin in this shot); only the radius zooms. */
  const VIEW = { lon0: 134.5, lat0: -43.25, R: 3000, Z0: 5, aLat: 16.2, ax: 1189, ay: 635 };
  const S0 = Math.sin(VIEW.lat0 * DEG), C0 = Math.cos(VIEW.lat0 * DEG);
  /** Unit orthographic coordinates (x east-ish, y up, z toward the viewer). */
  function o3(lon, lat) {
    const l = (lon - VIEW.lon0) * DEG, p = lat * DEG, cp = Math.cos(p), sp = Math.sin(p), cl = Math.cos(l);
    return [cp * Math.sin(l), C0 * sp - S0 * cp * cl, S0 * sp + C0 * cp * cl];
  }
  const pathLon = (lat) => G.PATH_C0[448] - 0.22 * (lat - 15.5);
  const A_UNIT = o3(pathLon(VIEW.aLat), VIEW.aLat);
  /** Globe state: one zoom curve (log-spring 5× → 1×, 4.0–5.5) anchored on central Luzon. */
  function globeAt(lt) {
    const k = L.sp(lt, 4.0, 1.5);
    const r = VIEW.R * Math.pow(VIEW.Z0, 1 - k);
    return { cx: VIEW.ax - A_UNIT[0] * r, cy: VIEW.ay + A_UNIT[1] * r, r, zoom: r / VIEW.R };
  }
  /** Project lon/lat at altitude h (Earth radii) with the globe state g. */
  const P = (g, lon, lat, h = 0) => { const v = o3(lon, lat), m = g.r * (1 + h); return [g.cx + v[0] * m, g.cy - v[1] * m, v[2]]; };
  const unitToScreen = (ctx, g) => ctx.transform(g.r, 0, 0, -g.r, g.cx, g.cy);
  /** Ground basis at a point: screen px per degree of arc toward east (e) and north (n). */
  function basis(g, lon, lat) {
    const d = 0.05, cl = Math.cos(lat * DEG);
    const o = P(g, lon, lat), e = P(g, lon + d / cl, lat), n = P(g, lon, lat + d);
    return { o, e: [(e[0] - o[0]) / d, (e[1] - o[1]) / d], n: [(n[0] - o[0]) / d, (n[1] - o[1]) / d] };
  }
  /** Path of a ground circle of radius rDeg (an ellipse on screen); caller strokes/fills. */
  function groundCircle(ctx, b, rDeg) {
    ctx.save(); ctx.transform(b.e[0], b.e[1], b.n[0], b.n[1], b.o[0], b.o[1]);
    ctx.beginPath(); ctx.arc(0, 0, rDeg, 0, TAU); ctx.restore();
  }

  /* --- Earth for the LEO shot. Custom rather than G.drawGlobe: its atmosphere rim is proportional
   *     (0.96–1.12 R), which becomes a 480 px band at R = 3000. Land paths are cached in unit
   *     coordinates (the view never rotates) and placed with one affine per frame. */
  let EARTH = null;
  function earthPaths() {
    if (EARTH) return EARTH;
    const bbox = (r) => { let a = 1e9, b = -1e9, c = 1e9, d = -1e9; for (let i = 0; i < r.length; i += 2) { a = Math.min(a, r[i]); b = Math.max(b, r[i]); c = Math.min(c, r[i + 1]); d = Math.max(d, r[i + 1]); } return [a, b, c, d]; };
    const reg = G.rings.region.map(bbox), PH = [116.5, 127, 4.4, 21.2];
    const world = G.rings.world.filter((r) => {
      const b = bbox(r);
      if (b[0] >= PH[0] && b[1] <= PH[1] && b[2] >= PH[2] && b[3] <= PH[3]) return false; // Philippines: 10 m set below
      return !reg.some((q) => q.every((v, i) => Math.abs(v - b[i]) < 0.8));                // finer regional ring exists
    });
    const ringsPath = (rings) => {
      const p = new Path2D();
      for (const ring of rings) {
        let vis = false;
        for (let i = 0; i < ring.length; i += 2) if (o3(ring[i], ring[i + 1])[2] > 0) { vis = true; break; }
        if (!vis) continue;
        for (let i = 0; i < ring.length; i += 2) {
          const v = o3(ring[i], ring[i + 1]); let x = v[0], y = v[1];
          if (v[2] < 0) { const n = Math.hypot(x, y) || 1; x /= n; y /= n; } // hidden points ride the limb
          i ? p.lineTo(x, y) : p.moveTo(x, y);
        }
        p.closePath();
      }
      return p;
    };
    const grat = new Path2D();
    for (let lon = 90; lon <= 180; lon += 10) { let st = false; for (let lat = -60; lat <= 60; lat += 1) { const v = o3(lon, lat); if (v[2] > 0) { st ? grat.lineTo(v[0], v[1]) : grat.moveTo(v[0], v[1]); st = true; } else st = false; } }
    for (let lat = -50; lat <= 50; lat += 10) { let st = false; for (let lon = 80; lon <= 190; lon += 1) { const v = o3(lon, lat); if (v[2] > 0) { st ? grat.lineTo(v[0], v[1]) : grat.moveTo(v[0], v[1]); st = true; } else st = false; } }
    return (EARTH = { land: ringsPath(world.concat(G.rings.region)), ph: ringsPath(G.rings.ph), luzon: ringsPath(G.rings.luzon), grat });
  }
  function drawEarth(ctx, g) {
    const E = earthPaths(), { cx, cy, r } = g;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
    const og = ctx.createRadialGradient(cx, cy, r * 0.82, cx, cy, r);
    og.addColorStop(0, '#0A1627'); og.addColorStop(0.75, '#0E1F35'); og.addColorStop(1, '#16344F');
    ctx.fillStyle = og; ctx.fill();
    ctx.clip();
    const m = ctx.getTransform();
    unitToScreen(ctx, g);
    ctx.lineWidth = 1 / r;
    ctx.strokeStyle = 'rgba(0,229,255,0.07)'; ctx.stroke(E.grat);
    ctx.fillStyle = '#19314D'; ctx.fill(E.land);
    ctx.strokeStyle = 'rgba(0,229,255,0.3)'; ctx.stroke(E.land);
    ctx.fillStyle = 'rgba(0,229,255,0.22)'; ctx.fill(E.ph);
    ctx.lineWidth = 1.3 / r; ctx.strokeStyle = 'rgba(0,229,255,0.9)'; ctx.stroke(E.ph);
    ctx.setTransform(m);
    // horizon haze inside the limb (absolute width, so it stays thin at any radius)
    const hz = ctx.createRadialGradient(cx, cy, r - 220, cx, cy, r);
    hz.addColorStop(0, 'rgba(0,229,255,0)'); hz.addColorStop(0.75, 'rgba(0,229,255,0.03)'); hz.addColorStop(1, 'rgba(0,229,255,0.13)');
    ctx.fillStyle = hz; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.restore();
    // thin atmosphere outside the limb + crisp limb line
    const ag = ctx.createRadialGradient(cx, cy, r, cx, cy, r + 110);
    ag.addColorStop(0, 'rgba(0,229,255,0.36)'); ag.addColorStop(0.1, 'rgba(0,229,255,0.16)'); ag.addColorStop(0.4, 'rgba(0,229,255,0.04)'); ag.addColorStop(1, 'rgba(0,229,255,0)');
    ctx.save();
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(cx, cy, r + 110, 0, TAU); ctx.arc(cx, cy, r, 0, TAU, true); ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,255,0.5)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  /* ALOS-1 ascending pass over path 448: footprint centre on the path's centre line, moving north. */
  const PASS = { lat4: 12.6, v: 0.9, gam: 4.36, h: 0.1086 }; // γ: ground offset at 34.3° off-nadir; h: 691.65 km / R⊕
  function footLat(lt) {
    if (lt <= 9.0) return PASS.lat4 + PASS.v * (lt - 4.0);
    return PASS.lat4 + PASS.v * 5.0 + PASS.v * 0.6 * (1 - Math.exp(-(lt - 9.0) / 0.6)); // eases to rest (C¹)
  }
  function dest(lon, lat, brgDeg, dDeg) {
    const p1 = lat * DEG, l1 = lon * DEG, b = brgDeg * DEG, d = dDeg * DEG;

        energy: lerp(tlA.energy, 0.6 + 0.35 * L.pulse(t) + 0.4 * Math.sin(Math.PI * clamp(kGo)), clamp(kLift)),
      };
      out.f = f; out.kGo = kGo;
    } else {
      out.tl = { ...tlA, form: 'pulse', alpha: 1 };
    }
    memoT = t; memo = out;
    return out;
  }

  /* ================================================================ scene */
  L.scene({
    id: 'act1', t0: 0, t1: DUR,
    init() {
      typeLayout(); sweepS(2.5); sarTex(); earthPaths();
      for (let i = 0; i < 3; i++) { puffSprite(i); shadowSprite(i); }
      for (const t of [0, 3, 6, 9.99]) layout(t);
    },
    tl(env) {
      return { ...layout(env.lt).tl };
    },
    draw(ctx, env) {
      const lt = env.lt, t = env.t, lay = typeLayout(), Lo = layout(lt);
      /* ---------------- B · low Earth orbit (drawn first: the type recedes over it) */
      if (lt >= 3.98) {
        const { g, pg } = Lo;
        const RF = 1500;                                                     // ≥ farthest frame corner from Luzon
        const unmask = RF * L.sp(lt, 4.0, 0.5);                            // Earth opens from the Luzon point
        const iris = RF * Math.max(0, 1 - 1.03 * L.sp(lt, 9.5, 0.45));     // closes onto the footprint (no overshoot)
        const rClip = Math.min(unmask, iris), opening = unmask < iris;
        const beamP = L.sp(lt, 5.5, 0.45);                                  // the beam reaches down from the antenna
        // final beats: the beam drains completely behind the TL (tail → 1), then is gone
        const tailF = Lo.kGo > 0.001 ? clamp(Lo.f - 0.06 * (1 - L.sp(lt, 9.5, 0.3))) : 0;
        const beamA = (1 - L.sp(lt, 9.5, 0.3)) * (1 - tailF > 0.01 ? 1 : 0);
        const fpA = Math.min(L.sp(lt, 6.0, 0.4), 1 - L.sp(lt, 9.5, 0.35));
        const latA = footLat(STRIP.t0), latB = footLat(Math.min(lt, STRIP.tEnd));
        const hole = lt > STRIP.t0 && latB - latA > 0.005 ? stripPoly(g, latA, latB) : null;
        if (rClip > 0.5) {
          const cxC = opening ? VIEW.ax : pg.F[0], cyC = opening ? VIEW.ay : pg.F[1];
          ctx.save();
          if (rClip < RF - 1) { ctx.beginPath(); ctx.arc(cxC, cyC, rClip, 0, TAU); ctx.clip(); }
          drawEarth(ctx, g);
          ctx.save(); ctx.beginPath(); ctx.arc(g.cx, g.cy, g.r, 0, TAU); ctx.clip();
          const puffs = cloudPuffs(lt, g);
          ctx.save(); clipOut(ctx, hole); drawPuffs(ctx, puffs, true); ctx.restore();
          drawStrip(ctx, lt, g, hole, L.sp(lt, STRIP.t0, 0.3));
          drawFootprint(ctx, lt, g, pg, fpA, 'ground');
          // lower beam: under the cloud deck
          const fLo = Math.max(tailF, BEAM.fCloud);
          if (beamP > BEAM.fCloud - BEAM.band && beamA > 0) {
            drawBeamBody(ctx, pg, lt, tailF, beamP, beamA, 'lower');
            drawBeamWaves(ctx, pg, lt, fLo, beamP, 0.45 * beamA);
          }
          ctx.save(); clipOut(ctx, hole); drawPuffs(ctx, puffs, false); ctx.restore();
          // radar penetrates the cloud: wavefronts and ripples continue through the deck (additive, fainter)
          if (beamP > BEAM.fCloud && beamA > 0) drawBeamWaves(ctx, pg, lt, fLo, beamP, 0.55 * beamA);
          drawFootprint(ctx, lt, g, pg, fpA, 'cloud');
          ctx.restore();
          ctx.restore();
          if (rClip < RF - 1) { // iris rim
            ctx.save(); ctx.strokeStyle = L.rgba(C.cyan, 0.75 * clamp(rClip / 120) * clamp((RF - rClip) / 200)); ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.arc(cxC, cyC, rClip, 0, TAU); ctx.stroke(); ctx.restore();
          }
        }
        // upper beam: above the clouds (drains behind the TL; outside the iris, so nothing pops)
        if (beamA > 0 && beamP > 0.001) {
          drawBeamBody(ctx, pg, lt, tailF, beamP, beamA, 'upper');
          drawBeamWaves(ctx, pg, lt, tailF, Math.min(beamP, BEAM.fCloud), beamA);
        }
        // orbit + satellite
        drawOrbit(ctx, lt, g, L.sp(lt, 4.5, 1.0), 1 - L.sp(lt, 9.0, 0.5));
        const satP = L.inout(lt, 4.5, 9.5, 1.0, 0.5);
        if (satP > 0.001) {
          ctx.save(); ctx.translate(pg.S[0], pg.S[1]); ctx.scale(-1, 1);
          L.drawALOS(ctx, { x: 0, y: 0, s: SAT_S, rot: pg.rot, p: satP, t });
          ctx.restore();
        }
        drawTag(ctx, lt);
        drawTitle(ctx, lt);
      }
      /* ---------------- A · type, seam, callout (shrinks into central Luzon on the shared zoom curve) */
      if (lt < 4.7) {
        const zk = lt >= 4.0 ? globeAt(lt).zoom / VIEW.Z0 : 1;
        ctx.save();
        if (zk < 1) { ctx.translate(VIEW.ax, VIEW.ay); ctx.scale(zk, zk); ctx.translate(-VIEW.ax, -VIEW.ay); }
        for (const w of lay.words) if (w.line === 0) drawWordIn(ctx, w, lt, lineOut(lt, 0));
        const sp = splitState(lt, Lo.pa), aOut = 1 - L.sp(lt, 4.0, 0.45);
        drawTrail(ctx, lt, Lo.pa, aOut);
        drawLine2(ctx, lt, lay, sp);
        if (sp) drawSeam(ctx, lt, sp, Lo.pa, aOut);
        ctx.restore();
        drawCallout(ctx, lt, Lo.pa);
      }
    },
  });
})();

</script>
<script>/* src/scenes/act2.js */
/* Act 2 — Raw ingestion & unification (10–18 s) · pipeline Phases 01–02.
 *
 * LAYOUT  Phase 01: SLC chip on the RIGHT (the act-1 pulse arrives at ≈(1296,554), so the pixel seats ~75 px away);
 *         archive (top) + spectrum (bottom) on the LEFT.  Phase 02: the DEM mesh builds where the chip was (right),
 *         the baseline network where the spectrum was (left).  Everything stays inside the HUD-safe box at the
 *         section's maximum camera push (×1.04 in 10–14, ×1.0816 in 14–18).
 *
 * BEAT PLAN  (lt = t − 10 s · 1 beat = 0.5 s · bars start at 10, 12, 14, 16 s)
 * ── Bar 6 · 10–12 s · PHASE 01 (the HUD header is automatic; only sub-labels here) ────────────────
 *  10.000  TL (L-band pulse from act 1) compresses into a Level 1.1 SLC pixel (pulse→pixel, spring 0.85 s),
 *          seating on cell (3,4) of a 12×12 SLC chip.  10.25 the SLC card blooms OUT OF the TL's live position.
 *  10.500  "LEVEL 1.1 SLC" / 10.625 "complex: amplitude + phase"; archive card constructs.
 *  10.625  speckled SLC scene strip scans in above the chip (crisp 2:1); 10.75 zoom box, 10.875 zoom leaders
 *          → the chip is that box blown up: one sample per cell.  10.75–11.625: 41×19 = 779 tiles fill in
 *          eight 16th-note sweeps, mono counter rolls 000 → 779.  11.0 "PALSAR Level 1.1 archives · 1.04 TB".
 *  10.875  spectrum card constructs; 11.0 frequency axis −14…+14 MHz.  11.125 phase channel scans over the chip
 *          (phasors: origin dot + stroke, faint hue; a 3-row phase band steps down the chip on every beat).
 *  11.125  FBS 28 MHz band (amber) rises + row tag "28 MHz" (legible ≥ 0.5 s before the bar).  11.375 FBD 14 MHz
 *          band (blue) + "14 MHz"; bandpass edges draw down at ±14 MHz with the bracket readout "28 MHz".
 *  11.750 / 11.875  captions (a pickup into the bar, so they hold ≥ 1.5 s before the exit wipe).
 * ── Bar 7 · 12–14 s ────────────────────────────────────────────────────────────────────────────────
 *  12.000  bandpass edges spring ±14 → ±7 MHz (0.5 s; readout + FBS tag roll 28 → 14), FBS out-of-band energy
 *          is clipped to a dashed ghost.  A divider separates the spectral domain from "RANGE SAMPLES";
 *          the inset 4.68 m slant-range ruler constructs.  12.125 FBS samples seat on every tick.
 *  12.250  FBD native samples arrive (coarser, offset).  12.5 resampling: interpolated FBD samples grow on
 *          every FBS tick while the native ones stay behind as fading ghost rings (no sliding).
 *  13.000  a lock sweep crosses the shared grid; both sample rows pulse together on the beat.
 *  13.250→13.60 archive · 13.50→13.85 SLC · 13.65→14.00 spectrum unmask (bottom-up scan wipes, ending ≤ 14.0).
 *          Under the departing chip the DEM's sea-level grid, coastline and a flat land lattice are already
 *          there (13.5 on, S→N); the network card constructs from 13.75 where the archive/spectrum leave.
 * ── Bar 8 · 14–16 s · PHASE 02 ─────────────────────────────────────────────────────────────────────
 *  14.000  central-Luzon DEM wireframe drops in row by row (N→S, springs, cyan while in flight, ×16 vertical);
 *          the TL pixel glides onto Cabanatuan (stem to the surface).  14.125 network axes (2007…2011 × B⊥ rel.
 *          reference); 14.25 network title + DEM label card; 14.75 footprint P448 F0290 draws on, N arrow;
 *          15.0–15.25 place tags Cabanatuan · Sierra Madre · Zambales Mts.
 *  15.000–15.625  24 acquisition dates land on 16ths (FBS amber / FBD blue); the reference slot is a ring.
 *  15.375  reference label; search window ±730 d × ±1,500 m springs open around the slot (labels 15.5).
 *  15.625  "· 000 pairs" joins the title; 15.75–16.25 the 132 pairs not involving the reference draw on in
 *          16th-note batches (left → right), the mono pair counter rolls with them.
 * ── Bar 9 · 16–18 s ────────────────────────────────────────────────────────────────────────────────
 *  16.000  TL flies (spring 0.6, slight sag under the reference label, low energy, behind the dates) to the
 *          reference slot, pixel → node.
 *  16.375  once landed, its 17 pairs radiate from it → counter reaches 149 (buildNetwork() searches seeds so
 *          that exactly 149 pairs satisfy Δt ≤ 730 d and |ΔB⊥| ≤ 1,500 m).
 *  16.5–17.25  the full web holds: a beat-locked signal pulse travels out along the reference pairs.
 *  17.000  mesh unmasks S→N, tags go.  17.25 labels scan out, window collapses.  17.5 edges + nodes contract
 *          into the TL (one spring), TL glides toward centre (17.5→17.875); 17.625→18.0 network card unmasks.
 *  18.000  only the TL remains: pure node (≈63 px), rippling on the beat, inside the hand-off box.
 */
(function () {
  'use strict';
  const L = window.LINOG, C = L.C, TAU = Math.PI * 2;
  const clamp = L.clamp, lerp = L.lerp;
  const T0 = 10, T1 = 18;

  /* ---------------------------------------------------------------- timing helpers */
  /** reveal 0..1 (spring, clamped, exact 0 before it starts) */
  const rv = (lt, at, d = 0.4) => { const v = L.sp(lt, at, d); return v < 0.003 ? 0 : clamp(v); };
  /** in at a, out at b (both springs) */
  const vis = (lt, a, b, din = 0.4, dout = 0.4) => { const v = Math.min(rv(lt, a, din), 1 - rv(lt, b, dout)); return v < 0.01 ? 0 : v; };
  /** exit progress: springs from (end − d), exactly 1 from `end` on */
  const qOut = (lt, end, d) => (lt >= end ? 1 : lt <= end - d ? 0 : clamp(L.spring(lt - (end - d), d * 0.8)));

  let INK = null;
  const ink = () => INK || (INK = {
    amber: L.ink(C.amber, C.card), blue: L.ink(C.blue, C.card), cyan: L.ink(C.cyan, C.card), cyanBg: L.ink(C.cyan, C.bg),
  });

  /* ---------------------------------------------------------------- layout (world coords) */
  // Phase 01 — archive (top left), spectrum (bottom left), SLC chip (right, next to the act-1 hand-off)
  const A = { x: 170, y: 170, w: 930, h: 300, cols: 41, rows: 19, px: 21, py: 10, tw: 17, th: 7, gx: 206, gy: 268 };
  const F = { x: 170, y: 494, w: 930, h: 436, lx: 202, px0: 430, px1: 1064, r1: 628, r2: 698, bh: 42, ax: 712, top: 572,
    div: 748, hd: 775, ru: 810, rx0: 292, rx1: 1014, c1: 874, c2: 906 };
  F.xc = (F.px0 + F.px1) / 2; F.ppm = (F.px1 - F.px0) / 29.6;
  const S = { x: 1140, y: 170, w: 640, h: 760, n: 12, cell: 38, tc: 3, tr: 4, gy: 412, stx: 1172, sty: 284, sw: 288, sh: 48, bx: 134, by: 18 };
  S.gw = S.n * S.cell; S.gx = S.x + (S.w - S.gw) / 2;
  const slcCell = (c, r) => [S.gx + (c + 0.5) * S.cell, S.gy + (r + 0.5) * S.cell];
  // Phase 02 — DEM mesh (right), network (left)
  const M = { lon0: 119.85, lon1: 121.85, lat0: 14.45, lat1: 16.95, nx: 41, ny: 52, S: 205, VX: 16, cx: 1452, cy: 492, pitch: 0.86, yaw: -0.26,
    anchor: [L.geo.places.cabanatuan.lon, L.geo.places.cabanatuan.lat] };
  M.ZS = (M.VX * M.S) / 111320; // world units per metre of height → vertical exaggeration ×VX
  const ML = { x: 1150, y: 800, w: 600, h: 116 };
  const N = { x: 172, y: 176, w: 930, h: 744, px0: 262, px1: 1067, py0: 322, py1: 814, t0: 2006.95, t1: 2011.25, b: 2600 };
  const nxOf = (yr) => N.px0 + ((yr - N.t0) / (N.t1 - N.t0)) * (N.px1 - N.px0);
  const nyOf = (b) => (N.py0 + N.py1) / 2 - (b / N.b) * ((N.py1 - N.py0) / 2);
  const END = [720, 560]; // where the TL node settles for the 18 s hand-off (world)
  const TLS = { pix: 35, node: 58 };
  const ARC = -36; // the 16.0 flight sags by this much (world px): it passes under the reference label, behind the dates
  const TAGS = [
    { s: 'Cabanatuan', lon: M.anchor[0], lat: M.anchor[1], at: 5.0, up: -34, side: -1 },
    { s: 'Sierra Madre', lon: 121.52, lat: 16.3, at: 5.125, up: 40, side: 1 },
    { s: 'Zambales Mts', lon: 120.13, lat: 15.5, at: 5.25, up: 44, side: 1 },
  ];

  /* ---------------------------------------------------------------- pure data (lazy: tl() may run before init) */
  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    GEO = { mesh: buildMesh(), net: buildNetwork() };
    return GEO;
  }
  let IMG = null;
  function imgs() {
    if (IMG) return IMG;
    const n = S.n;
    // the SLC scene strip (amplitude) — the chip is its zoom box, one sample per cell
    const strip = L.sarImage(S.sw, S.sh, { seed: 41, scale: 26, water: 0.3 });
    const sd = strip.getContext('2d').getImageData(0, 0, S.sw, S.sh).data;
    const a = new Float32Array(n * n), phi = new Float32Array(n * n), an = new Float32Array(n * n);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const i = r * n + c;
      a[i] = sd[((S.by + r) * S.sw + S.bx + c) * 4 + 2] / 255;
      phi[i] = TAU * L.hash2(c, r, 77); // fully developed speckle: uniformly random phase
    }
    const srt = Array.from(a).sort((p, q) => p - q), lo = srt[3], hi = srt[n * n - 4];
    const pc = L.canvas(n, n), px = pc.getContext('2d'), im = px.createImageData(n, n);
    const ac = L.canvas(n, n), ax = ac.getContext('2d'), ai = ax.createImageData(n, n);
    const c0 = L.hex('#0A111D'), c1 = L.hex('#E2EEF6');
    for (let i = 0; i < n * n; i++) {
      const col = L.fringeRGB(phi[i]);
      im.data[i * 4] = col[0]; im.data[i * 4 + 1] = col[1]; im.data[i * 4 + 2] = col[2]; im.data[i * 4 + 3] = 255;
      const v = Math.pow(clamp((a[i] - lo) / Math.max(1e-3, hi - lo)), 1.1);
      an[i] = v;
      for (let ch = 0; ch < 3; ch++) ai.data[i * 4 + ch] = lerp(c0[ch], c1[ch], v);
      ai.data[i * 4 + 3] = 255;
    }
    px.putImageData(im, 0, 0); ax.putImageData(ai, 0, 0);
    // archive tiles: brightness level (neutral — no FBS/FBD split is implied) + 16th-note sweep slot
    const nt = A.cols * A.rows, lev = new Uint8Array(nt), slot = new Uint8Array(nt);
    for (let c = 0; c < A.cols; c++) for (let r = 0; r < A.rows; r++) {
      const i = c * A.rows + r;
      lev[i] = Math.min(2, Math.floor(L.hash2(c, r, 9) * 3));
      slot[i] = Math.floor(clamp((c + r * 0.55) / (A.cols - 1 + (A.rows - 1) * 0.55)) * 7.999);
    }
    IMG = { strip, amp: ac, an, phi, phase: pc, lev, slot };
    return IMG;
  }

  /* ---- DEM mesh (schematic: L.geo.grid over central Luzon) */
  function buildMesh() {
    const g = L.geo.grid(M.lon0, M.lon1, M.lat0, M.lat1, M.nx, M.ny);
    const lonC = (M.lon0 + M.lon1) / 2, latC = (M.lat0 + M.lat1) / 2, K = L.geo.K;
    const n = M.nx * M.ny, X = new Float32Array(n), Y = new Float32Array(n), Z = new Float32Array(n), H = new Float32Array(n);
    for (let j = 0; j < M.ny; j++) for (let i = 0; i < M.nx; i++) {
      const k = j * M.nx + i;
      if (g.h[k] <= 0) continue;
      let s = 0, w = 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const jj = j + dj, ii = i + di;
        if (jj < 0 || ii < 0 || jj >= M.ny || ii >= M.nx) continue;
        const ww = di || dj ? 1 : 2; s += g.h[jj * M.nx + ii] * ww; w += ww;
      }
      H[k] = s / w;
    }
    for (let j = 0; j < M.ny; j++) for (let i = 0; i < M.nx; i++) {
      const k = j * M.nx + i;
      const lon = M.lon0 + ((M.lon1 - M.lon0) * i) / (M.nx - 1), lat = M.lat1 - ((M.lat1 - M.lat0) * j) / (M.ny - 1);
      X[k] = (lon - lonC) * K * M.S; Y[k] = (lat - latC) * M.S; Z[k] = H[k] * M.ZS;
    }
    const bin = (h) => (h < 3 ? 0 : h < 140 ? 1 : h < 420 ? 2 : h < 850 ? 3 : h < 1400 ? 4 : 5);
    const rowBin = new Uint8Array(M.ny * (M.nx - 1)), colBin = new Uint8Array(M.ny * M.nx);
    for (let j = 0; j < M.ny; j++) for (let i = 0; i < M.nx - 1; i++) rowBin[j * (M.nx - 1) + i] = bin(0.5 * (H[j * M.nx + i] + H[j * M.nx + i + 1]));
    for (let j = 1; j < M.ny; j++) for (let i = 0; i < M.nx; i++) colBin[j * M.nx + i] = bin(0.5 * (H[j * M.nx + i] + H[(j - 1) * M.nx + i]));
    const toW = (lon, lat, lift = 0) => [(lon - lonC) * K * M.S, (lat - latC) * M.S, L.geo.height(lon, lat) * M.ZS + lift];
    // P448 F0290 footprint (schematic), draped on the surface
    const fp = L.geo.footprint(448, L.geo.frameLats[290][0], L.geo.frameLats[290][1]), fpW = [];
    for (let e = 0; e < 4; e++) {
      const a = fp[e], b = fp[(e + 1) % 4];
      for (let s = 0; s < 18; s++) { const k = s / 18; fpW.push(toW(lerp(a[0], b[0], k), lerp(a[1], b[1], k), 4)); }
    }
    fpW.push(fpW[0]);
    // Luzon coastline (Natural Earth) inside the mesh window, as runs of [X, Y, row]
    const ring = L.geo.rings.luzon[0], coast = [];
    let run = null;
    for (let i = 0; i <= ring.length; i += 2) {
      const lon = ring[i % ring.length], lat = ring[(i + 1) % ring.length];
      const inside = lon > M.lon0 + 0.02 && lon < M.lon1 - 0.02 && lat > M.lat0 + 0.02 && lat < M.lat1 - 0.02;
      if (!inside) { if (run && run.length > 3) coast.push(run); run = null; continue; }
      if (!run) run = [];
      run.push((lon - lonC) * K * M.S, (lat - latC) * M.S, Math.round(((M.lat1 - lat) / (M.lat1 - M.lat0)) * (M.ny - 1)));
    }
    if (run && run.length > 3) coast.push(run);
    const tags = TAGS.map((tg) => ({ ...tg, w: toW(tg.lon, tg.lat, 3) }));
    const north = [toW(121.7, 14.6, 0), toW(121.7, 14.93, 0)];
    north[0][2] = 0; north[1][2] = 0;
    return { X, Y, Z, rowBin, colBin, fpW, coast, tags, north, fpNE: toW(fp[2][0], fp[2][1], 4),
      anchorS: toW(M.anchor[0], M.anchor[1], 3), anchor: toW(M.anchor[0], M.anchor[1], 46) };
  }
  const meshProj = (lt) => L.persp({ yaw: M.yaw + 0.06 * Math.sin((TAU * (lt - 4)) / 16), pitch: M.pitch, dist: 1600, f: 1600, cx: M.cx, cy: M.cy });

  /* ---- Baseline network for P448 F0290 (synthetic, seeded; dates on the ALOS 46-day repeat grid).
   *      Deterministic seed search until exactly 149 pairs satisfy Δt ≤ 730 d and |ΔB⊥| ≤ 1,500 m. */
  function buildNetwork() {
    const REF_YR = 2009 + 38 / 365; // 2009-02-08 (FBS coregistration reference)
    const gauss = (r) => Math.sqrt(-2 * Math.log(Math.max(1e-9, r()))) * Math.cos(TAU * r());
    for (let seed = 1; seed < 200000; seed++) {
      const r = L.rng(0x51a7 + seed * 977);
      const pool = [];
      for (let k = -16; k <= 16; k++) if (k) pool.push(k);
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
      const ks = [0].concat(pool.slice(0, 23)).sort((a, b) => a - b);
      const drift = (r() - 0.5) * 700, sig = 750 + 400 * r();
      const B = ks.map((k) => (k === 0 ? 0 : drift * ((k * 46) / 365.25) + gauss(r) * sig));
      if (B.some((b) => Math.abs(b) > 2250)) continue;
      { const lo = B.filter((b) => b < -400).length, hi = B.filter((b) => b > 400).length; if (lo < 6 || hi < 6) continue; }
      const E = [], deg = new Array(24).fill(0);
      for (let a = 0; a < 24; a++) for (let b = a + 1; b < 24; b++) {
        const dtDays = 46 * (ks[b] - ks[a]);
        if (dtDays <= 730 && Math.abs(B[b] - B[a]) <= 1500) { E.push([a, b]); deg[a]++; deg[b]++; }
      }
      if (E.length !== 149) continue;
      const ref = ks.indexOf(0);
      if (Math.min(...deg) < 4 || deg[ref] < 9 || deg[ref] > 17) continue;
      const yr = ks.map((k) => REF_YR + (k * 46) / 365.25);
      const fbs = yr.map((y) => { const m = Math.floor((y - Math.floor(y)) * 12); return m >= 10 || m <= 3; });
      const nF = fbs.filter(Boolean).length;
      if (nF < 9 || nF > 15) continue;
      const P = yr.map((y, i) => [nxOf(y), nyOf(B[i])]);
      let ok = true;
